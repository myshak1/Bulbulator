<html lang="pl"><head><meta charset="utf-8">

<title>Bulbulator</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#162032;--line:#334155;--txt:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--red:#dc2626;--ok:#22c55e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav{max-width:1440px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
nav h1{font-size:19px;margin:0;letter-spacing:.3px;white-space:nowrap}nav h1 small{font-weight:500;font-size:13px;margin-left:6px}
nav .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.pill.on{color:var(--txt)}.pill.on i{background:var(--ok);box-shadow:0 0 0 0 #22c55e88;animation:puls 2s infinite}
.pill.off i{background:var(--red)}
@keyframes puls{70%{box-shadow:0 0 0 7px #22c55e00}100%{box-shadow:0 0 0 0 #22c55e00}}
.flagi{display:flex;gap:6px}
.flagi button{background:none;border:2px solid transparent;border-radius:5px;padding:2px;cursor:pointer;line-height:0;opacity:.45}
.flagi button:hover{opacity:.8}.flagi button.on{opacity:1;border-color:var(--acc)}
.flagi svg{width:30px;height:20px;display:block;border-radius:2px}
main{max-width:1440px;margin:0 auto;padding:14px 16px 32px}
.mut,small{color:var(--mut)}
[hidden]{display:none!important}
button.b{background:var(--line);color:var(--txt);border:0;border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
button.b:hover{filter:brightness(1.2)}button.b.del{background:var(--red)}
button.b.mini{padding:5px 10px;font-size:13px}
button.b.obrys{background:transparent;border:1px solid var(--line)}button.b.obrys.del{border-color:#dc262688;color:#fca5a5}
button.b.on{background:var(--acc);color:#0b1220}

/* layout: camera + history on the left, live counters on the right */
.uklad{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"cam" "prawa" "hist"}
@media (min-width:1000px){.uklad{grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);grid-template-rows:auto 1fr;grid-template-areas:"cam prawa" "hist prawa"}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.p-nag{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.p-nag h2{font-size:16px;margin:0}
.p-nag .sp{flex:1}
#cam{grid-area:cam}#prawa{grid-area:prawa;display:grid;gap:14px;align-content:start;min-width:0}#hist{grid-area:hist;align-self:start}
section.sek{margin-top:14px}

/* camera */
.bk-obraz{position:relative;width:100%;touch-action:none;user-select:none;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:16/9}
.bk-obraz img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
.bk-obraz .brak{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;text-align:center;padding:16px}
.bk-ramka{position:absolute;border:2px solid var(--k);border-radius:4px;box-shadow:0 0 0 1px #000a}
.bk-ramka span{position:absolute;left:-2px;top:-2px;transform:translateY(-100%);font-size:12px;padding:1px 6px;border-radius:4px 4px 0 0;color:#fff;white-space:nowrap;background:var(--k);font-variant-numeric:tabular-nums}
.bk-ramka.blysk{animation:blysk .8s ease-out}
@keyframes blysk{0%{background:color-mix(in srgb,var(--k) 55%,transparent);box-shadow:0 0 0 1px #000a,0 0 18px 4px var(--k)}100%{background:transparent;box-shadow:0 0 0 1px #000a}}
.bk-obraz.obr span.bk-et{transform:translateY(-100%) rotate(180deg)}
.bk-obraz.tryb{cursor:crosshair;outline:3px solid var(--acc);outline-offset:-3px}
.bk-podp{font-size:13px;margin:8px 0 0}
.bk-podp.tryb{color:var(--acc);font-weight:600}

/* live cards */
.bk-karty{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-content:start}
@media (min-width:1000px){.bk-karty{grid-template-columns:1fr}}
.bk-karta{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--k);border-radius:12px;padding:12px 14px}
.bk-nag{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bk-kol{width:12px;height:12px;border-radius:3px;flex:none;background:var(--k)}
.bk-karta.blysk .bk-kol{animation:kropka .8s ease-out}
@keyframes kropka{0%{transform:scale(1.9);box-shadow:0 0 10px var(--k)}100%{transform:none}}
.bk-nazwa{flex:1;background:transparent;border:1px solid transparent;color:var(--txt);font-size:16px;font-weight:600;padding:2px 4px;border-radius:6px;min-width:0}
.bk-nazwa:hover,.bk-nazwa:focus{border-color:var(--line);outline:none}
.bk-st{font-size:12px;color:var(--mut);white-space:nowrap}
.bk-gl{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}
.bk-gl b{font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.bk-sia{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;font-size:13px}
.bk-sia div{display:flex;flex-direction:column;min-width:0}.bk-sia span{color:var(--mut);font-size:12px}
.bk-sia strong{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-syg{width:100%;height:56px;display:block;margin:10px 0 6px;background:#0b1220;border-radius:6px}
.bk-dol{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bk-cz{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);flex:1;min-width:180px}.bk-cz input{flex:1;min-width:60px}.bk-cz b{color:var(--txt);min-width:26px}

/* history + statistics */
.bk-wyk{position:relative}
.bk-wyk canvas{width:100%;height:240px;display:block}
.bk-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--txt);margin-bottom:6px;align-items:center}
.bk-leg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.bk-tip{position:absolute;pointer-events:none;background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--txt);white-space:nowrap;display:none;z-index:3}
.bk-tip i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.bk-zak{display:flex;gap:4px;flex-wrap:wrap}
.csv{font-size:13px;width:100%;text-align:right;margin-top:6px}.csv a{color:inherit}
.tab-wrap{overflow-x:auto}
.bk-tab{width:100%;border-collapse:collapse;font-size:13px}
.bk-tab th,.bk-tab td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.bk-tab tr:last-child td{border-bottom:0}
.bk-tab td:first-child{white-space:normal;min-width:130px}.bk-tab td small{display:block}
.bk-tab th{color:var(--mut);font-weight:600}
.bk-tab td:not(:first-child),.bk-tab th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.ust{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.ust label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);min-width:220px;max-width:520px;flex:1;gap:4px}
.tips{font-size:13px;margin:12px 0 0;line-height:1.5}
footer{max-width:1440px;margin:0 auto;padding:0 16px 24px;font-size:12px;color:var(--mut);display:flex;gap:6px 14px;flex-wrap:wrap}footer a{color:inherit}
</style></head>
<body>
<header><nav>
  <h1>🍷 Bulbulator <small class="mut" id="wersja"></small></h1>
  <span class="mut" style="font-size:13px" data-t="sub"></span>
  <span class="pill" id="bkLive"><i></i><span id="bkLiveT" data-t="connecting"></span></span>
  <span class="sp"></span>
  <div class="flagi" role="group" aria-label="Language">
    <button type="button" data-lang="pl" title="Polski" aria-label="Polski"><svg viewBox="0 0 16 10"><rect width="16" height="5" fill="#fff"/><rect y="5" width="16" height="5" fill="#dc143c"/></svg></button>
    <button type="button" data-lang="en" title="English" aria-label="English"><svg viewBox="0 0 60 30"><clipPath id="uk1"><path d="M0,0v30h60V0z"/></clipPath><clipPath id="uk2"><path d="M30,15h30v15zv15H0zH0V0zV0h30z"/></clipPath><g clip-path="url(#uk1)"><path d="M0,0v30h60V0z" fill="#012169"/><path d="M0,0 60,30M60,0 0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 60,30M60,0 0,30" clip-path="url(#uk2)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></g></svg></button>
  </div>
</nav></header>
<main>
<div class="uklad">
  <section class="panel" id="cam">
    <div class="p-nag">
      <h2>📷 <span data-t="camera"></span></h2>
      <small id="bkFotoT"></small>
      <span class="sp"></span>
      <button class="b mini obrys" id="bkObrBtn" data-t="rotateBtn"></button>
    </div>
    <div class="bk-obraz" id="bkObraz"><img id="bkImg" alt=""><div class="brak" id="bkBrak" data-t="noImage"></div></div>
    <p class="bk-podp mut" id="bkPodp" data-t="areasHint"></p>
  </section>

  <div id="prawa">
    <div class="bk-karty" id="bkKarty"></div>
    <section class="panel">
      <div class="p-nag">
        <h2 data-t="stats"></h2>
        <small id="bkOdKiedy"></small>
        <span class="sp"></span>
        <button class="b mini obrys del" id="bkNowa" data-t="newFerm"></button>
      </div>
      <div class="tab-wrap"><table class="bk-tab" id="bkTab"></table></div>
    </section>
  </div>

  <section class="panel" id="hist">
    <div class="p-nag">
      <h2><span data-t="history"></span> <small data-t="perMinute"></small></h2>
      <span class="sp"></span>
      <div class="bk-zak" id="bkZak">
        <button class="b mini" data-z="6h">6 h</button><button class="b mini" data-z="24h">24 h</button><button class="b mini" data-z="48h">48 h</button>
        <button class="b mini" data-z="7d" data-t="r7d"></button><button class="b mini" data-z="all" data-t="rAll"></button>
      </div>
    </div>
    <div class="bk-wyk">
      <div class="bk-leg" id="bkLeg"></div>
      <canvas id="bkCanvas"></canvas>
      <div class="bk-tip" id="bkTip"></div>
    </div>
    <div class="csv mut"><span data-t="data"></span> <a href="historia_min.csv" data-t="csvMin"></a> · <a href="historia_godz.csv" data-t="csvHour"></a></div>
  </section>
</div>

<section class="panel sek">
  <div class="p-nag"><h2 data-t="settings"></h2></div>
  <div class="ust">
    <label><span><span data-t="minGap"></span> <b id="bkPrV"></b> s</span><input type="range" id="bkPr" min="0.1" max="2" step="0.05"></label>
    <button class="b" id="bkZapisz" data-t="save"></button>
  </div>
  <p class="tips mut" data-t="tips"></p>
</section>
</main>
<footer>
  <span>© 2026 Kris SP2KMO</span>
  <span data-t="license"></span>
  <a href="https://github.com/myshak1/Bulbulator">github.com/myshak1/Bulbulator</a>
</footer>
<script>

(() => {

const TXT = {

    data: 'Dane:', csvMin: 'minutowe (CSV)', csvHour: 'godzinowe (CSV)',
    stats: 'Statystyki fermentacji', fermSince: 'od {d}',
    newFerm: '⟲ Nowa fermentacja', newFermQ: 'Zacząć nową fermentację?\n\nLiczniki wszystkich gąsiorów, historia i statystyki zaczną się od zera. Dotychczasowe dane zostaną zachowane na serwerze jako archiwum CSV.',
    newFermBusy: 'Zeruję…', newFermDone: 'Wyzerowano ✓',

    areasDrag: 'Przeciągnij prostokąt wokół rurki: {name}. Kliknij „Zaznacz rurkę” ponownie, żeby anulować.', areasSaved: 'Zapisano obszar: {name}.',
    areasSmall: 'Za mały prostokąt, spróbuj ponownie.', imgAlt: 'Obraz z kamery z zaznaczonymi rurkami',
    settings: 'Ustawienia', minGap: 'Min. odstęp między bąblami:',

    jar: 'Gąsior {n}', bps: 'bąbli/s', avg10: '(średnio z 10 s)', perMin: 'Bąbli/min', perHour: 'Bąbli/godz.',
    instant: 'Chwilowo', last: 'Ostatni bąbel', total: 'Łącznie', since: 'Liczone od',
    mark: 'Zaznacz rurkę', markCancel: 'Anuluj', reset: 'Zeruj', resetT: 'Zeruj licznik tego gąsiora', resetQ: 'Wyzerować licznik łączny: {name}?',

    nameAria: 'Nazwa gąsiora', sigAria: 'Sygnał wykrywania na żywo', chartAria: 'Wykres liczby bąbli na minutę w czasie',

    none: 'brak danych', rowNow: 'Teraz (ostatnia minuta)', rowHour: 'Średnio, ostatnia godzina', rowDay: 'Średnio, ostatnie 24 h',
    rowMax: 'Najwięcej w godzinie (7 dni)', rowTrend: 'Trend (6 h do poprzednich 6 h)', rowTotal: 'Bąbli łącznie', rowTime: 'Czas liczenia',
    trNone: '→ brak bąbli', trSteady: '→ stabilnie', trUp: '↑ przyspiesza (+{p}%)', trDown: '↓ zwalnia ({p}%)', days: '{d} d {h} h'
  },
  en: {

    camera: 'Camera', imgAge: 'image {n} s old', noImage: 'Waiting for the camera image…', rotateBtn: '↻ Rotate 180°',
    history: 'History', perMinute: '(bubbles per minute)', r7d: '7 days', rAll: 'All',
    data: 'Data:', csvMin: 'per minute (CSV)', csvHour: 'per hour (CSV)',
    stats: 'Fermentation statistics', fermSince: 'since {d}',
    newFerm: '⟲ New fermentation', newFermQ: 'Start a new fermentation?\n\nThe counters of all jars, the history and the statistics start from zero. The old data is kept on the server as a CSV archive.',
    newFermBusy: 'Resetting…', newFermDone: 'Reset done ✓',
    areasHint: 'To mark an airlock, click “Mark airlock” on a jar card and drag a rectangle on the image.',
    areasDrag: 'Drag a rectangle around the airlock: {name}. Click “Mark airlock” again to cancel.', areasSaved: 'Area saved: {name}.',
    areasSmall: 'Rectangle too small, try again.', imgAlt: 'Camera image with the marked airlocks',
    settings: 'Settings', minGap: 'Min. time between bubbles:',

    license: 'MIT License',
    jar: 'Jar {n}', bps: 'bubbles/s', avg10: '(10 s average)', perMin: 'Bubbles/min', perHour: 'Bubbles/hour',
    instant: 'Instant', last: 'Last bubble', total: 'Total', since: 'Counting since',
    mark: 'Mark airlock', markCancel: 'Cancel', reset: 'Reset', resetT: 'Reset this jar’s counter', resetQ: 'Reset the total counter: {name}?',
    sens: 'Sensitivity', sensT: 'lower = catches weaker bubbles', stCounting: '● counting', stMark: 'mark the airlock', stNoData: 'no data',
    nameAria: 'Jar name', sigAria: 'Live detection signal', chartAria: 'Chart of bubbles per minute over time',
    sAgo: '{n} s ago', minAgo: '{n} min ago', empty: 'No data in this range yet — history is saved every minute.',
    none: 'no data', rowNow: 'Now (last minute)', rowHour: 'Average, last hour', rowDay: 'Average, last 24 h',
    rowMax: 'Busiest hour (7 days)', rowTrend: 'Trend (last 6 h vs previous 6 h)', rowTotal: 'Total bubbles', rowTime: 'Counting time',

  }
};
function jezykStartowy() {
  const q = new URLSearchParams(location.search).get('lang');
  if (q && TXT[q]) return q;
  try { const s = localStorage.getItem('bulbulator-lang'); if (s && TXT[s]) return s; } catch (e) {}
  return (navigator.language || '').toLowerCase().startsWith('pl') ? 'pl' : 'en';
}
const LANG = jezykStartowy(), LOC = LANG === 'pl' ? 'pl-PL' : 'en-GB';
const t = (k, v = {}) => (TXT[LANG][k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
document.documentElement.lang = LANG;
document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
document.querySelectorAll('.flagi button').forEach(b => {
  b.classList.toggle('on', b.dataset.lang === LANG);
  b.onclick = () => { try { localStorage.setItem('bulbulator-lang', b.dataset.lang); } catch (e) {} const u = new URL(location.href); u.searchParams.delete('lang'); location.href = u.toString(); };
});

/* ---------- state ---------- */
const g = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KOLORY = ['#3987e5', '#d95926', '#199e70', '#c98500'];   // colour-blind safe on a dark background
let cfg = {gasiory: [], czulosc: 4, przerwa_min: 0.35};
let N = 0, stan = null, hist = null, zakres = '24h', zaznaczam = -1, rys = null, os = {w: 1280, h: 720};
let statDane = {min: [], godz: []}, punkty = null, fotoT = 0, ostatnie = [];
const liczba = (v, m = 1) => v == null ? '–' : (+v).toLocaleString(LOC, {maximumFractionDigits: m});
const nazwa = i => { const n = (cfg.gasiory[i] || {}).nazwa || ''; const m = /^(Gąsior|Jar) (\d)$/.exec(n); return m ? t('jar', {n: m[2]}) : n; };
const dataGodz = ts => new Date(ts * 1000).toLocaleString(LOC, {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
g('bkImg').alt = t('imgAlt'); g('bkCanvas').setAttribute('aria-label', t('chartAria'));

/* ---------- config ---------- */
async function wczytajCfg() {
  try {
    const r = await fetch('config.json?t=' + Date.now(), {cache: 'no-store'});
    if (r.ok) { const c = await r.json(); if (c && Array.isArray(c.gasiory) && c.gasiory.length) cfg = c; }
  } catch (e) {}
  if (!cfg.gasiory.length) cfg.gasiory = [1, 2].map(n => ({nazwa: `Gąsior ${n}`, roi: null, reset: 0}));
  cfg.gasiory = cfg.gasiory.slice(0, 4);
  N = cfg.gasiory.length;
  if (typeof cfg.obrot !== 'boolean') {   // older installs kept this setting in the browser
    try { cfg.obrot = JSON.parse(localStorage.getItem('kamera') || '{}').obr === true; } catch (e) { cfg.obrot = false; }
  }
  g('bkPr').value = cfg.przerwa_min ?? 0.35; g('bkPrV').textContent = g('bkPr').value;
  budujKarty(); stosujObrot(); rysujRamki();
}
async function zapiszCfg() {
  try {
    const r = await fetch('config.json', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(cfg)});
    if (!r.ok) throw new Error(r.status);
    return true;

    wiersz(t('rowHour'), godzina) +
    wiersz(t('rowDay'), i => { const v = srednia(m, i, teraz - 86400, teraz, 60); return v == null ? '–' : `${liczba(v, 1)}/min`; }) +
    wiersz(t('rowMax'), maks) +
    wiersz(t('rowTrend'), trend) +
    wiersz(t('rowTotal'), i => s(i) ? liczba(s(i).lacznie, 0) : '–') +
    wiersz(t('rowTime'), czas);
}

/* ---------- refresh loops ---------- */
function wszystko() { odswiezObraz(); wczytajHist(); wczytajStatystyki(); odswiezStan(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) wszystko(); });
setInterval(odswiezStan, 1000);
setInterval(odswiezObraz, 2000);
setInterval(wiekObrazu, 1000);
setInterval(() => { if (!document.hidden) { wczytajHist(); wczytajStatystyki(); } }, 60000);
window.addEventListener('resize', rysujWykres);
zaznaczZakres();
wczytajCfg().then(wszystko);
})();
</script>
