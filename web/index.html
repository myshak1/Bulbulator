<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Bulbulator</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#162032;--line:#334155;--txt:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--red:#dc2626;--ok:#22c55e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav{max-width:1440px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
nav h1{font-size:19px;margin:0;letter-spacing:.3px;white-space:nowrap}nav h1 small{font-weight:500;font-size:13px;margin-left:6px}
nav .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.pill.on{color:var(--txt)}.pill.on i{background:var(--ok);box-shadow:0 0 0 0 #22c55e88;animation:puls 2s infinite}
.pill.off i{background:var(--red)}
@keyframes puls{70%{box-shadow:0 0 0 7px #22c55e00}100%{box-shadow:0 0 0 0 #22c55e00}}
.flagi{display:flex;gap:6px}
.flagi button{background:none;border:2px solid transparent;border-radius:5px;padding:2px;cursor:pointer;line-height:0;opacity:.45}
.flagi button:hover{opacity:.8}.flagi button.on{opacity:1;border-color:var(--acc)}
.flagi svg{width:30px;height:20px;display:block;border-radius:2px}
main{max-width:1440px;margin:0 auto;padding:14px 16px 32px}
.mut,small{color:var(--mut)}
[hidden]{display:none!important}
button.b{background:var(--line);color:var(--txt);border:0;border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
button.b:hover{filter:brightness(1.2)}button.b.del{background:var(--red)}
button.b.mini{padding:5px 10px;font-size:13px}
button.b.obrys{background:transparent;border:1px solid var(--line)}button.b.obrys.del{border-color:#dc262688;color:#fca5a5}
button.b.on{background:var(--acc);color:#0b1220}

/* layout: camera + history on the left, live counters on the right */
.uklad{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"cam" "prawa" "hist"}
@media (min-width:1000px){.uklad{grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);grid-template-rows:auto 1fr;grid-template-areas:"cam prawa" "hist prawa"}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.p-nag{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.p-nag h2{font-size:16px;margin:0}
.p-nag .sp{flex:1}
#cam{grid-area:cam}#prawa{grid-area:prawa;display:grid;gap:14px;align-content:start;min-width:0}#hist{grid-area:hist;align-self:start}
section.sek{margin-top:14px}

/* camera */
.bk-obraz{position:relative;width:100%;touch-action:none;user-select:none;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:16/9}
.bk-obraz img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
.bk-obrazwrap{position:relative}
.bk-obrazwrap:fullscreen{background:#000;display:flex;align-items:center;justify-content:center}
.bk-obrazwrap:fullscreen .bk-obraz{width:min(100vw,calc(100vh * var(--ar,1.7778)));border-radius:0;aspect-ratio:auto}
.bk-obrazwrap:fullscreen .bk-ramka span{font-size:16px;padding:2px 8px}
.bk-obrazwrap:fullscreen .bk-pauza{border-radius:0}
.pe-zamknij{display:none;position:absolute;top:12px;right:12px;z-index:4;background:#0b1220cc;color:#fff;border:1px solid #fff4;border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.bk-obrazwrap:fullscreen .pe-zamknij{display:block}
.bk-karta.wst .bk-gl,.bk-karta.wst .bk-sia,.bk-karta.wst .bk-syg{opacity:.5}
.bk-nag button.ikona{width:30px;padding:4px 0}
.bk-pauza{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;border-radius:8px;background:#0f172a99}
.bk-pauza span{background:#f59e0b;color:#0b1220;font-weight:700;padding:6px 16px;border-radius:99px;font-size:15px}
.bk-ramka.wyl{border-style:dashed;opacity:.45}
button.b.pz{background:#f59e0b;color:#0b1220;font-weight:600}
.pill.pz{color:var(--txt)}.pill.pz i{background:#f59e0b}
.bk-karta.wyl .bk-gl,.bk-karta.wyl .bk-sia,.bk-karta.wyl .bk-syg,.bk-karta.wyl .bk-sygpod,.bk-karta.wyl .bk-dol{opacity:.35}
.bk-obraz .brak{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;text-align:center;padding:16px}
.bk-ramka{position:absolute;border:2px solid var(--k);border-radius:4px;box-shadow:0 0 0 1px #000a}
.bk-ramka span{position:absolute;left:-2px;top:-2px;transform:translateY(-100%);font-size:12px;padding:1px 6px;border-radius:4px 4px 0 0;color:#fff;white-space:nowrap;background:var(--k);font-variant-numeric:tabular-nums}
.bk-ramka.blysk{animation:blysk .8s ease-out}
@keyframes blysk{0%{background:color-mix(in srgb,var(--k) 55%,transparent);box-shadow:0 0 0 1px #000a,0 0 18px 4px var(--k)}100%{background:transparent;box-shadow:0 0 0 1px #000a}}
.bk-obraz.obr span.bk-et{transform:translateY(-100%) rotate(180deg)}
.bk-obraz.tryb{cursor:crosshair;outline:3px solid var(--acc);outline-offset:-3px}
.bk-podp{font-size:13px;margin:8px 0 0}
.bk-podp.tryb{color:var(--acc);font-weight:600}

/* live cards */
.bk-karty{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-content:start}
@media (min-width:1000px){.bk-karty{grid-template-columns:1fr}}
.bk-karta{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--k);border-radius:12px;padding:12px 14px}
.bk-nag{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bk-kol{width:12px;height:12px;border-radius:3px;flex:none;background:var(--k)}
.bk-karta.blysk .bk-kol{animation:kropka .8s ease-out}
@keyframes kropka{0%{transform:scale(1.9);box-shadow:0 0 10px var(--k)}100%{transform:none}}
.bk-nazwa{flex:1;background:transparent;border:1px solid transparent;color:var(--txt);font-size:16px;font-weight:600;padding:2px 4px;border-radius:6px;min-width:0}
.bk-nazwa:hover,.bk-nazwa:focus{border-color:var(--line);outline:none}
.bk-st{font-size:12px;color:var(--mut);white-space:nowrap}
.bk-gl{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}
.bk-gl b{font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.bk-sia{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;font-size:13px}
.bk-sia div{display:flex;flex-direction:column;min-width:0}.bk-sia span{color:var(--mut);font-size:12px}
.bk-sia strong{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-syg{width:100%;height:80px;display:block;margin:10px 0 2px;background:#0b1220;border-radius:6px;cursor:ns-resize;touch-action:none}
.bk-sygpod{font-size:11px;color:var(--mut);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bk-dol{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bk-cz{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);flex:1;min-width:200px}.bk-cz input{flex:1;min-width:60px}.bk-cz b{color:var(--txt);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.bk-cz button{width:26px;padding:3px 0}

/* history + statistics */
.bk-wyk{position:relative}
.bk-wyk canvas{width:100%;height:240px;display:block}
.bk-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--txt);margin-bottom:6px;align-items:center}
.bk-leg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.bk-tip{position:absolute;pointer-events:none;background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--txt);white-space:nowrap;display:none;z-index:3}
.bk-tip i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.bk-zak{display:flex;gap:4px;flex-wrap:wrap}
.csv{font-size:13px;width:100%;text-align:right;margin-top:6px}.csv a{color:inherit}
.tab-wrap{overflow-x:auto}
.bk-tab{width:100%;border-collapse:collapse;font-size:13px}
.bk-tab th,.bk-tab td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.bk-tab tr:last-child td{border-bottom:0}
.bk-tab td:first-child{white-space:normal;min-width:130px}.bk-tab td small{display:block}
.bk-tab th{color:var(--mut);font-weight:600}
.bk-tab td:not(:first-child),.bk-tab th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.ust{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-start}
.ust .chk{flex-direction:row!important;align-items:center;gap:8px!important;min-width:0!important;flex:0 0 auto!important;color:var(--txt)!important;font-size:14px!important}
.ust .ok{color:var(--ok);font-weight:600}
.ust .grupa{display:flex;flex-direction:column;gap:8px;flex:1;min-width:260px;max-width:520px}
.ust .grupa label{max-width:none}
.ciemno-teraz.za{color:#f59e0b;font-weight:600}
select.b{background:var(--panel2);color:var(--txt);border:1px solid var(--line);color-scheme:dark;max-width:100%;font-size:13px;padding:4px 8px}
.notatki{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.not-form{display:flex;gap:6px;flex-wrap:wrap}
.not-form input{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;color-scheme:dark}
.not-form input[type=text]{flex:1;min-width:180px}
.not-lista{list-style:none;margin:8px 0 0;padding:0;font-size:13px;max-height:180px;overflow-y:auto}
.not-lista li{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line)}
.not-lista li:last-child{border-bottom:0}
.not-lista li .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.not-lista li i{color:#f59e0b;font-style:normal}
.not-lista button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px;padding:0 4px}.not-lista button:hover{color:#fca5a5}
.arch-info{font-size:13px;margin-top:8px;line-height:1.6}.arch-info a{color:inherit}
.arch-info b{font-variant-numeric:tabular-nums}
.ust label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);min-width:220px;max-width:520px;flex:1;gap:4px}
.tips{font-size:13px;margin:12px 0 0;line-height:1.5}
footer{max-width:1440px;margin:0 auto;padding:0 16px 24px;font-size:12px;color:var(--mut);display:flex;gap:6px 14px;flex-wrap:wrap}footer a{color:inherit}
</style></head>
<body>
<header><nav>
  <h1>🍷 Bulbulator <small class="mut" id="wersja"></small></h1>
  <span class="mut" style="font-size:13px" data-t="sub"></span>
  <span class="pill" id="bkLive"><i></i><span id="bkLiveT" data-t="connecting"></span></span>
  <span class="sp"></span>
  <button class="b mini obrys" id="bkPePelny" hidden></button>
  <div class="flagi" role="group" aria-label="Language">
    <button type="button" data-lang="pl" title="Polski" aria-label="Polski"><svg viewBox="0 0 16 10"><rect width="16" height="5" fill="#fff"/><rect y="5" width="16" height="5" fill="#dc143c"/></svg></button>
    <button type="button" data-lang="en" title="English" aria-label="English"><svg viewBox="0 0 60 30"><clipPath id="uk1"><path d="M0,0v30h60V0z"/></clipPath><clipPath id="uk2"><path d="M30,15h30v15zv15H0zH0V0zV0h30z"/></clipPath><g clip-path="url(#uk1)"><path d="M0,0v30h60V0z" fill="#012169"/><path d="M0,0 60,30M60,0 0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 60,30M60,0 0,30" clip-path="url(#uk2)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></g></svg></button>
  </div>
</nav></header>
<main>
<div class="uklad">
  <section class="panel" id="cam">
    <div class="p-nag">
      <h2>📷 <span data-t="camera"></span></h2>
      <small id="bkFotoT"></small>
      <span class="sp"></span>
      <button class="b mini" id="bkPauza"></button>
      <button class="b mini obrys" id="bkObrBtn" data-t="rotateBtn"></button>
      <button class="b mini obrys" id="bkPeKam" hidden data-t="fsCam"></button>
    </div>
    <div class="bk-obrazwrap">
      <div class="bk-obraz" id="bkObraz"><img id="bkImg" alt=""><div class="brak" id="bkBrak" data-t="noImage"></div></div>
      <div class="bk-pauza" id="bkPauzaInfo" hidden><span id="bkPauzaTxt"></span></div>
      <button class="pe-zamknij" id="bkPeZamknij" data-t="fsClose"></button>
    </div>
    <p class="bk-podp mut" id="bkPodp" data-t="areasHint"></p>
  </section>

  <div id="prawa">
    <div class="bk-karty" id="bkKarty"></div>
    <section class="panel">
      <div class="p-nag">
        <h2 data-t="stats"></h2>
        <small id="bkOdKiedy"></small>
        <span class="sp"></span>
        <button class="b mini obrys del" id="bkNowa" data-t="newFerm"></button>
      </div>
      <div class="tab-wrap"><table class="bk-tab" id="bkTab"></table></div>
    </section>
  </div>

  <section class="panel" id="hist">
    <div class="p-nag">
      <h2><span data-t="history"></span> <small data-t="perMinute"></small></h2>
      <select class="b mini" id="bkFerm" hidden aria-label="Fermentacja"></select>
      <span class="sp"></span>
      <div class="bk-zak" id="bkZak">
        <button class="b mini" data-z="6h">6 h</button><button class="b mini" data-z="24h">24 h</button><button class="b mini" data-z="48h">48 h</button>
        <button class="b mini" data-z="7d" data-t="r7d"></button><button class="b mini" data-z="all" data-t="rAll"></button>
      </div>
    </div>
    <div class="bk-wyk">
      <div class="bk-leg" id="bkLeg"></div>
      <canvas id="bkCanvas"></canvas>
      <div class="bk-tip" id="bkTip"></div>
    </div>
    <div class="csv mut" id="bkCsv"><span data-t="data"></span> <a href="historia_min.csv" data-t="csvMin"></a> · <a href="historia_godz.csv" data-t="csvHour"></a></div>
    <div class="arch-info mut" id="bkArchInfo" hidden></div>
    <div class="notatki">
      <form class="not-form" id="bkNotForm">
        <input type="datetime-local" id="bkNotT" data-ta="noteTime">
        <input type="text" id="bkNotTxt" maxlength="100" data-tp="notePh" data-ta="notePh">
        <button class="b mini" type="submit" data-t="noteAdd"></button>
      </form>
      <ul class="not-lista" id="bkNotLista"></ul>
    </div>
  </section>
</div>

<section class="panel sek">
  <div class="p-nag"><h2 data-t="settings"></h2></div>
  <div class="ust">
    <label><span><span data-t="minGap"></span> <b id="bkPrV"></b> s <small class="ok" id="bkPrOk"></small></span><input type="range" id="bkPr" min="0.1" max="2" step="0.05"></label>
    <div class="grupa">
      <label class="chk"><input type="checkbox" id="bkAuto"> <span data-t="autoDark"></span> <small class="ok" id="bkAutoOk"></small></label>
      <label><span><span data-t="darkLevel"></span> <b id="bkJmV"></b> · <span class="ciemno-teraz" id="bkJmTeraz"></span></span><input type="range" id="bkJm" min="1" max="160" step="1"></label>
      <small class="mut" data-t="autoDarkHint"></small>
    </div>
  </div>
  <p class="tips mut" data-t="tips"></p>
</section>
</main>
<footer>
  <span>© 2026 Kris SP2KMO</span>
  <span data-t="license"></span>
  <a href="https://github.com/myshak1/Bulbulator">github.com/myshak1/Bulbulator</a>
</footer>

/* ---------- config ----------
   Every change is applied to the NEWEST config on the server (read just before saving), and the
   page re-reads the config every 5 s. Two open pages (or a phone in the background) can no longer
   overwrite each other's settings with an old copy. */
const gas = (c, i) => { if (!Array.isArray(c.gasiory)) c.gasiory = []; while (c.gasiory.length <= i) c.gasiory.push({}); return c.gasiory[i]; };

const wToku = new Set();   // jars whose threshold is being changed on this page right now
async function pobierzCfg() {
  const r = await fetch('config.json?t=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error(r.status);
  const txt = await r.text();
  return [txt, JSON.parse(txt)];
}
async function wczytajCfg() {
  try { const [txt, c] = await pobierzCfg(); if (c && Array.isArray(c.gasiory) && c.gasiory.length) { cfg = c; cfgTekst = txt; } } catch (e) {}
  if (!cfg.gasiory.length) cfg.gasiory = [1, 2].map(n => ({nazwa: `Gąsior ${n}`, roi: null, reset: 0}));
  cfg.gasiory = cfg.gasiory.slice(0, 4);
  N = cfg.gasiory.length;

    try { cfg.obrot = JSON.parse(localStorage.getItem('kamera') || '{}').obr === true; } catch (e) { cfg.obrot = false; }
  }

}
async function zmien(fn) {   // fn sets one thing; it runs on this page's copy and on the newest config
  fn(cfg); odswiezWidok();

    let c = null;
    try { c = (await pobierzCfg())[1]; } catch (e) {}
    if (!c || typeof c !== 'object' || !Array.isArray(c.gasiory)) c = JSON.parse(JSON.stringify(cfg));
    fn(c);
    const body = JSON.stringify(c);
    const r = await fetch('config.json', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body});
    if (!r.ok) throw new Error(r.status);
    cfgTekst = body; przyjmijCfg(c);
    return true;
  } catch (e) { alert(t('saveFail', {e: e.message})); return false; }
}
async function odswiezCfg() {
  if (document.hidden) return;
  try { const [txt, c] = await pobierzCfg(); if (txt !== cfgTekst && c && Array.isArray(c.gasiory) && c.gasiory.length) { cfgTekst = txt; przyjmijCfg(c); } } catch (e) {}
}
function przyjmijCfg(c) {   // take over a config read from the server, keeping what is being edited here
  const stare = cfg;

  c.gasiory.forEach((gs, i) => { if (wToku.has(i) && stare.gasiory[i]) gs.prog = stare.gasiory[i].prog; });
  cfg = c;
  if (cfg.gasiory.length !== N) { N = cfg.gasiory.length; budujKarty(); }
  cfg.gasiory.forEach((gs, i) => { const n = g('bkN' + i); if (n && document.activeElement !== n) n.value = nazwa(i); pokazProg(i); });

}

    for (let i = 0; i < N; i++) if (r[i + 1] != null) { e.s[i] += r[i + 1]; e.n[i]++; }

  const notatki = [...(a.info.notatki || []).map(n => ({x: (n.t - startA) / 86400, t: n.t, tekst: `${t('archNote')} ${n.tekst}`})),
                   ...notatkiTeraz().map(n => ({x: (n.t - startB) / 86400, t: n.t, tekst: n.tekst}))];
  return {xmin: 0, xmax: xmax * 1.02, czasowa: false, przerwa: 1.6 / 24, serie, notatki};
}
function rysujLegende(m) {
  const serie = m && m.serie ? m.serie : cfg.gasiory.map((gs, i) => ({kolor: KOLORY[i], nazwa: nazwa(i)}));
  g('bkLeg').innerHTML = serie.map(s => `<span><i style="background:${s.dash ? `repeating-linear-gradient(90deg,${s.kolor} 0 5px,transparent 5px 8px)` : s.kolor}"></i>${esc(s.nazwa)}</span>`).join('') +
    (m && m.czasowa === false ? `<small class="mut">${esc(t('dayAxTitle'))}</small>` : '');
}
function rysujWykres() {
  const a = ferm && archiwa.find(x => x.stamp === ferm);
  const m = a ? modelPorownania(a) : modelBiezacy();
  rysujLegende(m);
  const cv = g('bkCanvas'), [c, w, h] = przygotuj(cv);
  const mut = '#94a3b8', line = '#334155', txt = '#e2e8f0';
  punkty = null;
  c.font = '12px system-ui,sans-serif';
  if (!m || m.wczytuje || !m.serie.some(s => s.pkt.some(p => p.v != null))) {
    c.fillStyle = mut; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(m && m.wczytuje ? t('archLoad') : t('empty'), 12, h / 2); return;
  }
  const L = 44, R = 84, T = 14, B = 24, pw = w - L - R, ph = h - T - B;
  const ymax = ladnyMax(Math.max(...m.serie.flatMap(s => s.pkt.filter(p => p.v != null).map(p => p.v))) * 1.1);
  const X = x => L + (x - m.xmin) / (m.xmax - m.xmin) * pw, Y = v => T + ph - v / ymax * ph;
  c.strokeStyle = line; c.lineWidth = 1; c.fillStyle = mut; c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let k = 0; k <= 4; k++) { const v = ymax * k / 4, y = Math.round(Y(v)) + .5; c.beginPath(); c.moveTo(L, y); c.lineTo(L + pw, y); c.stroke(); c.fillText(liczba(v, 1), L - 6, y); }
  c.textAlign = 'center'; c.textBaseline = 'top';
  if (m.czasowa) {
    const zakresS = m.xmax - m.xmin, nEt = Math.max(2, Math.floor(pw / 90));
    for (let k = 0; k <= nEt; k++) {
      const x = m.xmin + zakresS * k / nEt, dt = new Date(x * 1000);
      c.fillText(zakresS > 2.5 * 86400 ? dt.toLocaleDateString(LOC, {day: '2-digit', month: '2-digit'}) : dt.toLocaleTimeString(LOC, {hour: '2-digit', minute: '2-digit'}), X(x), T + ph + 6);
    }
  } else {
    const krok = Math.max(1, Math.ceil((m.xmax - m.xmin) / Math.max(2, Math.floor(pw / 60))));
    for (let k = 0; k <= m.xmax; k += krok) c.fillText(t('dayAx', {n: k}), X(k), T + ph + 6);
  }
  // notes: dashed amber line with a small flag
  for (const n of m.notatki) {
    if (n.x < m.xmin || n.x > m.xmax) continue;
    const x = Math.round(X(n.x)) + .5;
    c.strokeStyle = NOTA_KOL; c.lineWidth = 1; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(x, T); c.lineTo(x, T + ph); c.stroke(); c.setLineDash([]);
    c.fillStyle = NOTA_KOL; c.beginPath(); c.moveTo(x, T - 8); c.lineTo(x + 8, T - 4); c.lineTo(x, T); c.fill();
  }
  const konce = [];
  m.serie.forEach(s => {
    c.strokeStyle = s.kolor; c.lineWidth = s.dash ? 1.5 : 2; c.setLineDash(s.dash ? [6, 4] : []); c.lineJoin = 'round'; c.lineCap = 'round'; c.beginPath();
    let ost = null;
    for (const p of s.pkt) {
      if (p.v == null) { ost = null; continue; }
      const x = X(p.x), y = Y(p.v);
      (ost && !(m.przerwa && p.x - ost.px > m.przerwa)) ? c.lineTo(x, y) : c.moveTo(x, y);
      ost = {x, y, v: p.v, px: p.x, kolor: s.kolor, dash: s.dash};
    }
    c.stroke(); c.setLineDash([]);
    const koniec = [...s.pkt].reverse().find(p => p.v != null);
    if (koniec && !s.dash) konce.push({x: X(koniec.x), y: Y(koniec.v), v: koniec.v, kolor: s.kolor});
  });
  konce.sort((a, b) => a.y - b.y);   // direct labels at the line ends, spaced so they do not overlap
  let poprz = -1e9;
  for (const o of konce) {
    const ly = Math.min(T + ph, Math.max(T, Math.max(o.y, poprz + 14))); poprz = ly;
    c.fillStyle = o.kolor; c.beginPath(); c.arc(o.x, o.y, 4, 0, 7); c.fill();
    c.fillStyle = txt; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(`${liczba(o.v, 1)}/min`, o.x + 8, ly);
  }
  punkty = {m, X, Y, L, pw, T, ph};
}
const wyk = g('bkCanvas'), tip = g('bkTip');
wyk.addEventListener('pointermove', e => {
  if (!punkty) return; const r = wyk.getBoundingClientRect(), x = e.clientX - r.left, {m, X, Y} = punkty;
  if (x < punkty.L || x > punkty.L + punkty.pw) { tip.style.display = 'none'; rysujWykres(); return; }
  const xv = m.xmin + (x - punkty.L) / punkty.pw * (m.xmax - m.xmin);
  const tol = m.czasowa ? Math.max(8, punkty.pw / 240) : Math.max(8, punkty.pw / ((m.xmax - m.xmin) * 24) * 1.5);
  const wiersze = m.serie.map(s => {
    let best = null; for (const p of s.pkt) { if (p.v == null) continue; const dx = Math.abs(X(p.x) - x); if (!best || dx < best.dx) best = {dx, p}; }
    return {s, p: best && best.dx <= tol ? best.p : null};
  });
  rysujWykres(); const c = wyk.getContext('2d');
  c.strokeStyle = '#94a3b8'; c.lineWidth = 1; c.beginPath(); c.moveTo(x, punkty.T); c.lineTo(x, punkty.T + punkty.ph); c.stroke();
  wiersze.forEach(({s, p}) => { if (!p) return; c.fillStyle = s.kolor; c.strokeStyle = '#1e293b'; c.lineWidth = 2; c.beginPath(); c.arc(X(p.x), Y(p.v), 5, 0, 7); c.fill(); c.stroke(); });
  const noty = m.notatki.filter(n => Math.abs(X(n.x) - x) <= 6);
  const naglowek = m.czasowa ? dataGodz(xv) : t('dayTip', {d: Math.floor(xv), h: Math.floor(xv % 1 * 24)});
  tip.innerHTML = `<div class="mut" style="margin-bottom:4px">${naglowek}</div>` +
    wiersze.map(({s, p}) => `<div><i style="background:${s.kolor}"></i>${esc(s.nazwa)}: <b>${p ? liczba(p.v, 1) + ' /min' : t('none')}</b></div>`).join('') +
    noty.map(n => `<div style="color:${NOTA_KOL};margin-top:4px;white-space:normal;max-width:260px">✎ ${dataGodz(n.t)} · ${esc(n.tekst)}</div>`).join('');
  tip.style.display = 'block';
  tip.style.left = (x + 24 + tip.offsetWidth > r.width ? x - tip.offsetWidth - 12 : x + 24) + 'px'; tip.style.top = (e.clientY - r.top + 20) + 'px';
});
wyk.addEventListener('pointerleave', () => { tip.style.display = 'none'; rysujWykres(); });

/* ---------- statistics ---------- */
function srednia(wiersze, i, odT, doT, krok) {
  const w = wiersze.filter(r => r[0] >= odT && r[0] < doT && r[i + 1] != null); if (!w.length) return null;
  return w.reduce((s, r) => s + r[i + 1], 0) / (w.length * krok / 60);
}
function rysujTabele() {
  if (!N) return;
  const teraz = Date.now() / 1000, m = statDane.min, h = statDane.godz;
  const wiersz = (opis, f) => `<tr><td>${opis}</td>${cfg.gasiory.map((gs, i) => `<td>${f(i)}</td>`).join('')}</tr>`;
  const s = i => stan && stan.gasiory && stan.gasiory[i];
  const rs = Math.max(cfg.reset_stat || 0, (stan && stan.reset_stat) || 0);
  g('bkOdKiedy').textContent = rs ? t('fermSince', {d: dataGodz(rs)}) : '';
  const trend = i => {
    const a = srednia(m, i, teraz - 6 * 3600, teraz, 60), b = srednia(m, i, teraz - 12 * 3600, teraz - 6 * 3600, 60);
    if (a == null || b == null) return '–';
    if (b < 0.05 && a < 0.05) return t('trNone');
    const p = (a - b) / Math.max(b, 0.01) * 100;
    return Math.abs(p) < 10 ? t('trSteady') : (p > 0 ? t('trUp', {p: Math.round(p)}) : t('trDown', {p: Math.round(p)}));
  };
  const maks = i => {
    const w = h.filter(r => r[0] > teraz - 7 * 86400 && r[i + 1] != null); if (!w.length) return '–';
    const x = w.reduce((a, r) => r[i + 1] > a[i + 1] ? r : a);
    return `${liczba(x[i + 1] / 60, 1)}/min <small class="mut">(${dataGodz(x[0])})</small>`;
  };
  const czas = i => { const x = s(i); if (!x) return '–'; const d = teraz - x.od; return t('days', {d: Math.floor(d / 86400), h: Math.floor(d % 86400 / 3600)}); };
  const godzina = i => {   // bubbles in the last hour, divided by the time actually counted
    const x = s(i); if (!x) return '–';
    const min = Math.max(1, Math.min(3600, stan.t - Math.max(stan.start || 0, x.od || 0)) / 60);
    return `${liczba(x.bph / min, 1)}/min`;
  };
  g('bkTab').innerHTML = `<tr><th></th>${cfg.gasiory.map((gs, i) => `<th><span class="bk-kol" style="--k:${KOLORY[i]};display:inline-block;margin-right:6px;vertical-align:-1px"></span>${esc(nazwa(i))}</th>`).join('')}</tr>` +
    wiersz(t('rowNow'), i => s(i) && s(i).aktywny ? `${liczba(s(i).bpm, 0)}/min` : '–') +
    wiersz(t('rowHour'), godzina) +
    wiersz(t('rowDay'), i => { const v = srednia(m, i, teraz - 86400, teraz, 60); return v == null ? '–' : `${liczba(v, 1)}/min`; }) +
    wiersz(t('rowMax'), maks) +
    wiersz(t('rowTrend'), trend) +
    wiersz(t('rowTotal'), i => s(i) ? liczba(s(i).lacznie, 0) : '–') +
    wiersz(t('rowTime'), czas);
}

/* ---------- refresh loops ---------- */
function wszystko() { odswiezObraz(); odswiezCfg(); wczytajHist(); wczytajStatystyki(); odswiezStan(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) wszystko(); });

setInterval(odswiezCfg, 5000);
setInterval(() => { if (!document.hidden) wczytajArchiwa(); }, 10 * 60000);

setInterval(wiekObrazu, 1000);
setInterval(() => { if (!document.hidden) { wczytajHist(); wczytajStatystyki(); } }, 60000);
window.addEventListener('resize', rysujWykres);
zaznaczZakres();
wczytajCfg().then(() => { wszystko(); wczytajArchiwa(); });
})();
