# Bulbulator behind nginx at https://example.com/bulbulator/
# Put this inside your server { } block (or save it as a snippet and include it).
# Create the login file first:  sudo htpasswd -c /etc/nginx/bulbulator.htpasswd youruser
# In bulbulator.service comment out BULBULATOR_HTTP when using this.

location = /bulbulator { absolute_redirect off; return 301 /bulbulator/; }
location /bulbulator/ {
    auth_basic "Bulbulator";
    auth_basic_user_file /etc/nginx/bulbulator.htpasswd;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    alias /opt/bulbulator/web/;
    index index.html;
    location = /bulbulator/stan.json     { alias /run/bulbulator/stan.json; access_log off; }
    location = /bulbulator/snapshot.jpg  { alias /run/bulbulator/snapshot.jpg; access_log off; }
    location ~ ^/bulbulator/(?<hplik>historia_min|historia_godz)\.csv$ { alias /var/lib/bulbulator/$hplik.csv; }
    # archive of earlier fermentations (list as JSON + files), version 1.5+
    location ^~ /bulbulator/archiwum/ {
        alias /var/lib/bulbulator/archiwum/;
        autoindex on;
        autoindex_format json;
    }
    location = /bulbulator/config.json {
        alias /var/lib/bulbulator/config.json;
        dav_methods PUT;
        limit_except GET HEAD PUT { deny all; }
        client_max_body_size 16k;
    }
}
